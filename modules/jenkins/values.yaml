# Top-level in the Jenkins chart: creates the controller service account.
# The Kaniko agent pods reference this same SA (jenkins-sa) — its IRSA
# annotation grants ECR push. Nesting this under `controller:` is ignored
# by the chart, which is why agent pods failed with "jenkins-sa not found".
serviceAccount:
  create: true
  name: jenkins-sa
  annotations:
    eks.amazonaws.com/role-arn: "${kaniko_role_arn}"

controller:
  # Pin a controller image new enough for the :latest plugins below
  # (configuration-as-code/kubernetes/workflow require Jenkins >= 2.504.1).
  image:
    tag: "2.504.1-jdk17"

  admin:
    username: admin
    password: "${jenkins_admin_password}"

  serviceType: LoadBalancer
  servicePort: 80
  service:
    port: 80
    targetPort: 8080

  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  persistentVolume:
    enabled: true
    storageClass: ""
    size: 10Gi
  
  JCasC:
    configScripts:
      env-config: |
        jenkins:
          globalNodeProperties:
            - envVars:
                env:
                  - key: "ECR_REPO"
                    value: "${ecr_repo_url}"
      credentials-config: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-token"
                      username: "${github_user}"
                      password: "${github_pat}"
                      description: "GitHub PAT for CI git push"
      seed-jobs: |
        jobs:
          - script: |
              pipelineJob('django-app-ci') {
                // Define the poll trigger on the job itself so it survives every
                // re-seed (a Jenkinsfile-only trigger is wiped until the next build).
                triggers {
                  scm('* * * * *')
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/Maksym-Kryvenko/goit-devops.git')
                          credentials('github-token')
                        }
                        branch('*/final-project')
                        // Ignore commits confined to charts/ (the pipeline's own
                        // tag-bump commits) so they don't retrigger a build. Any
                        // change outside charts/ (i.e. django/ app code) triggers.
                        extensions {
                          pathRestriction {
                            includedRegions('')
                            excludedRegions('charts/.*')
                          }
                        }
                      }
                    }
                    scriptPath('Jenkinsfile')
                    lightweight(true)
                  }
                }
              }
      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "eks"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                directConnection: false
                skipTlsVerify: true
                podLabels:
                  - key: "jenkins"
                    value: "agent"
                templates:
                  - name: "kaniko"
                    label: "kaniko"
                    namespace: "jenkins"
                    serviceAccount: "jenkins-sa"
                    yamlMergeStrategy: "override"
                    containers:
                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:debug"
                        command: "sleep"
                        args: "99d"
                        ttyEnabled: true

  installPlugins:
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - credentials-binding:latest
    - github:latest
    - kubernetes:latest
    - job-dsl:latest

