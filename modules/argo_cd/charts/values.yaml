applications:
  - name: django-app
    namespace: default
    project: default
    source:
      repoURL: https://github.com/Maksym-Kryvenko/goit-devops.git
      path: charts/django-app
      targetRevision: final-project
      helm:
        valueFiles:
          - values.yaml
    destination:
      server: https://kubernetes.default.svc
      namespace: default
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true

repositories:
  - name: goit-devops
    url: https://github.com/Maksym-Kryvenko/goit-devops.git
    username: ""
    password: ""
